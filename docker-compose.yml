services:
  autonomous-creator:
    build: .
    container_name: autonomous_ai_creator
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DB_PATH=/app/data/agent.db
      - DATABASE_URL=${DATABASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - AGENT_TRIGGER_SECRET=${AGENT_TRIGGER_SECRET:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["http://localhost:3000"]}
      - ENABLE_INTERNAL_SCHEDULER=${ENABLE_INTERNAL_SCHEDULER:-false}
      - DEFAULT_POSTING_INTERVAL_MINUTES=30
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
